<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정신병동</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#171717;font-family:'Gaegu',cursive;min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer}
.page{min-height:100vh;padding:28px;display:flex;justify-content:center;align-items:center}
.paper{width:min(980px,100%);min-height:650px;position:relative;padding:45px 55px;border:3px solid #171717;box-shadow:7px 8px 0 #171717;transform:rotate(-.25deg);background:#fff}
.title{font-family:'Jua',sans-serif;font-size:clamp(42px,7vw,82px);text-align:center;margin:15px 0 8px}.subtitle{text-align:center;font-size:27px;margin-bottom:38px}
.sketch{font-size:100px;text-align:center;line-height:1;margin:20px}.btn{background:#fff;border:3px solid #171717;padding:10px 24px;box-shadow:4px 5px 0 #171717;transition:.12s;font-size:24px}.btn:hover{transform:translate(2px,2px);box-shadow:2px 3px 0 #171717}.btn:active{transform:translate(4px,5px);box-shadow:none}
.center{text-align:center}.back{position:absolute;left:25px;top:22px;border:0;background:none;font-size:24px;text-decoration:underline}.form{max-width:560px;margin:25px auto}
label{display:block;font-size:26px;margin:18px 0 7px}input,textarea{width:100%;border:3px solid #171717;padding:12px 15px;background:#fff;outline:none;font-size:24px}textarea{min-height:270px;resize:vertical}.note{font-size:19px;margin:7px 0}.error{color:#b00020;font-size:21px;margin:10px 0}
.ward-head{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:3px dashed #171717;padding-bottom:18px}.room{font-family:'Jua',sans-serif;font-size:42px}.patient{font-size:25px}.actions{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin:30px 0}
.meds{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:25px;margin:25px 0}.med{border:3px solid #171717;padding:18px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;box-shadow:4px 4px 0 #171717;transform:rotate(var(--r));cursor:pointer}.med:nth-child(2n){--r:1.1deg}.med:nth-child(3n){--r:-1.4deg}.med:nth-child(4n){--r:.4deg}.med-icon{font-size:65px}.med-name{font-size:27px;text-align:center}.private{font-size:17px;margin-top:5px}
.tour-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px}.room-card{border:3px solid #171717;padding:18px;box-shadow:4px 4px 0 #171717;transform:rotate(var(--r))}.room-card:nth-child(2n){--r:1deg}.room-card:nth-child(3n){--r:-.8deg}.room-card h3{font-family:'Jua',sans-serif;font-size:30px;margin:0 0 5px}.room-card p{font-size:21px;margin:6px 0}.small{font-size:18px}
.modal-bg{position:fixed;inset:0;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{position:relative;background:#fff;border:3px solid #171717;box-shadow:8px 8px 0 #171717;max-width:650px;width:100%;padding:35px;max-height:90vh;overflow:auto}.modal h2{font-family:'Jua',sans-serif;font-size:38px;margin:0 0 12px}.post-body{white-space:pre-wrap;font-size:25px;line-height:1.6;border-top:2px dashed #171717;border-bottom:2px dashed #171717;padding:20px 5px;margin:20px 0}.choice{display:flex;gap:10px;align-items:center;font-size:23px;margin:12px 0}.choice input{width:auto}.hidden{display:none!important}.doodle{position:absolute;font-size:28px}.d1{top:25px;right:35px}.d2{bottom:25px;left:35px}.d3{bottom:30px;right:45px}
.danger{border-color:#9b1c1c;color:#9b1c1c;box-shadow:4px 5px 0 #9b1c1c}.danger:hover{box-shadow:2px 3px 0 #9b1c1c}
@media(max-width:650px){.page{padding:12px}.paper{padding:38px 20px;min-height:calc(100vh - 24px)}.room{font-size:32px}.ward-head{align-items:flex-start}.title{font-size:48px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
let state={screen:'home',profile:null,error:'',editing:null};

function csrf(){const m=document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);return m?decodeURIComponent(m[1]):''}
async function api(url,options={}){
  const opts={...options,headers:{'Content-Type':'application/json',...(options.headers||{})}};
  if(opts.method && opts.method!=='GET') opts.headers['X-CSRFToken']=csrf();
  const r=await fetch(url,opts); let data={}; try{data=await r.json()}catch(e){}
  if(!r.ok) throw new Error(data.error||'오류가 발생했습니다.');
  return data;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function app(){document.getElementById('app').innerHTML=render();bind()}
function render(){
 if(state.screen==='home') return `<div class="page"><main class="paper"><div class="doodle d1">✎</div><div class="doodle d2">⋯? ◌</div><div class="doodle d3">☠</div><div class="sketch">🏥</div><h1 class="title">정신병동</h1><div class="subtitle">여기는 조금 이상한 병원입니다.</div><div class="center"><p style="font-size:31px">입원하시겠습니까?</p><button class="btn" id="start">입원하기</button></div></main></div>`;
 if(state.screen==='login') return `<div class="page"><main class="paper"><button class="back" data-screen="home">← 나가기</button><h1 class="title">환자 카드</h1><p class="subtitle">이름과 나만의 코드를 입력하세요.</p><div class="form"><label>이름</label><input id="name" placeholder="예: 이현지"><label>코드</label><input id="code" placeholder="예: 0730" autocomplete="off"><p class="note">※ 같은 이름이라도 코드가 다르면 다른 호실입니다.</p>${state.error?`<p class="error">${esc(state.error)}</p>`:''}<div class="center" style="margin-top:25px"><button class="btn" id="enter">입원하기</button></div></div></main></div>`;
 if(state.screen==='ward') return ward();
 if(state.screen==='prescribe') return prescribe();
 if(state.screen==='write') return writePost();
 if(state.screen==='tour') return tour();
}
function ward(){const p=state.profile;return `<div class="page"><main class="paper"><div class="ward-head"><div><div class="room">${esc(p.code)}호실</div><div class="patient">환자 ${esc(p.name)}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn" style="font-size:17px;padding:7px 12px" id="deleteProfile">프로필 삭제</button><button class="btn" style="font-size:19px;padding:7px 13px" id="logout">퇴원</button></div></div><div class="center"><p style="font-size:29px">처방된 약</p></div><div class="meds">${p.posts.length?p.posts.map((x,i)=>medCard(x,i)).join(''):`<p style="grid-column:1/-1;text-align:center;font-size:25px">아직 처방된 약이 없습니다.</p>`}</div><div class="actions"><button class="btn" id="prescribe">💊 처방받기</button><button class="btn" id="tour">🏥 병원 둘러보기</button></div></main></div>`}
function medCard(x,i){return `<div class="med" data-post="${i}"><div class="med-icon">${x.private?'🔒':'💊'}</div><div class="med-name">${esc(x.medicine)}</div>${x.private?'<div class="private">비공개</div>':''}</div>`}
function prescribe(){return `<div class="page"><main class="paper"><button class="back" data-screen="ward">← 호실</button><h1 class="title">처방전</h1><div class="form"><label>약 이름</label><input id="medicine" placeholder="원하는 이름을 직접 지어주세요"><p class="note">예: 새벽의 망상 / 오늘의 개소리 / 비밀처방전</p><div class="center" style="margin-top:30px"><button class="btn" id="nextWrite">다음 →</button></div></div></main></div>`}
function writePost(){return `<div class="page"><main class="paper"><button class="back" data-screen="prescribe">← 처방전</button><h1 class="title">증상 기록</h1><p class="subtitle">💊 ${esc(state.editing.medicine)}</p><div class="form"><textarea id="body" placeholder="자유롭게 작성하세요..."></textarea><div style="margin-top:18px"><label class="choice"><input type="checkbox" id="private"> 비공개로 처방하기</label><p class="note">비공개 글은 본인 호실에서만 볼 수 있습니다.</p></div><div class="center" style="margin-top:25px"><button class="btn" id="complete">처방 완료</button></div></div></main></div>`}
async function tour(){return `<div class="page"><main class="paper"><button class="back" data-screen="ward">← 내 호실</button><h1 class="title">병원 둘러보기</h1><p class="subtitle">친구들의 공개된 처방을 구경합니다.</p><div id="tourGrid" class="tour-grid"><p style="font-size:22px">병동을 불러오는 중...</p></div></main></div>`}
function bind(){
 document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{state.screen=b.dataset.screen;state.error='';app()});
 const start=document.getElementById('start');if(start)start.onclick=()=>{state.screen='login';app()};
 const enter=document.getElementById('enter');if(enter)enter.onclick=enterWard;
 const logout=document.getElementById('logout');if(logout)logout.onclick=logout;
 const del=document.getElementById('deleteProfile');if(del)del.onclick=deleteProfile;
 const prescribe=document.getElementById('prescribe');if(prescribe)prescribe.onclick=()=>{state.screen='prescribe';app()};
 const tourBtn=document.getElementById('tour');if(tourBtn)tourBtn.onclick=async()=>{state.screen='tour';app();await loadTour()};
 document.querySelectorAll('[data-post]').forEach(b=>b.onclick=()=>showPost(state.profile.posts[Number(b.dataset.post)],true));
 const next=document.getElementById('nextWrite');if(next)next.onclick=()=>{const m=document.getElementById('medicine').value.trim();if(!m)return alert('약 이름을 입력해주세요.');state.editing={medicine:m};state.screen='write';app()};
 const complete=document.getElementById('complete');if(complete)complete.onclick=completePost;
}
async function enterWard(){const name=document.getElementById('name').value.trim(),code=document.getElementById('code').value.trim();if(!name||!code){state.error='이름과 코드를 모두 입력해주세요.';app();return}try{const d=await api('/api/login/',{method:'POST',body:JSON.stringify({name,code})});state.profile=d.profile;state.error='';state.screen='ward';app()}catch(e){state.error=e.message;app()}}
async function refreshMe(){const d=await api('/api/me/');if(!d.loggedIn){state.profile=null;state.screen='home';return false}state.profile=d.profile;return true}
async function logout(){await api('/api/logout/',{method:'POST'});state={screen:'home',profile:null,error:'',editing:null};app()}
async function deleteProfile(){if(!confirm('정말 이 프로필을 삭제할까요?\n이 호실의 모든 처방 기록도 함께 삭제됩니다.'))return;try{await api('/api/profile/delete/',{method:'DELETE'});state={screen:'home',profile:null,error:'',editing:null};alert('프로필이 삭제되었습니다.');app()}catch(e){alert(e.message)}}
async function completePost(){const body=document.getElementById('body').value.trim();if(!body)return alert('글을 작성해주세요.');try{const d=await api('/api/posts/',{method:'POST',body:JSON.stringify({medicine:state.editing.medicine,body,private:document.getElementById('private').checked})});state.profile.posts.unshift(d.post);state.editing=null;state.screen='ward';app()}catch(e){alert(e.message)}}
function showPost(x,own){const modal=document.createElement('div');modal.className='modal-bg';modal.innerHTML=`<div class="modal"><button class="back" id="close">✕</button>${own?'<button class="btn" id="editPost" style="position:absolute;right:35px;top:30px;font-size:19px;padding:6px 13px">수정</button>':''}<h2>💊 ${esc(x.medicine)}</h2><div class="small">환자 ${esc(state.profile.name)} · ${esc(state.profile.code)}호실 ${x.private?'· 🔒 비공개':''}</div><div class="post-body">${esc(x.body)}</div><div class="center"><button class="btn" id="close2">닫기</button></div></div>`;document.body.appendChild(modal);modal.querySelector('#close').onclick=()=>modal.remove();modal.querySelector('#close2').onclick=()=>modal.remove();const edit=modal.querySelector('#editPost');if(edit)edit.onclick=()=>editPost(x,modal)}
function editPost(x,oldModal){oldModal.remove();const modal=document.createElement('div');modal.className='modal-bg';modal.innerHTML=`<div class="modal"><button class="back" id="cancelEdit">✕</button><h2>✏️ 처방 수정</h2><div class="form" style="margin-top:15px"><label>약 이름</label><input id="editMedicine" value="${esc(x.medicine)}"><label>증상 기록</label><textarea id="editBody">${esc(x.body)}</textarea><label class="choice"><input type="checkbox" id="editPrivate" ${x.private?'checked':''}> 비공개</label><p class="note">비공개 글은 본인 호실에서만 볼 수 있습니다.</p><div class="center" style="margin-top:25px"><button class="btn" id="saveEdit">수정 완료</button></div></div></div>`;document.body.appendChild(modal);modal.querySelector('#cancelEdit').onclick=()=>{modal.remove();showPost(x,true)};modal.querySelector('#saveEdit').onclick=async()=>{const medicine=modal.querySelector('#editMedicine').value.trim(),body=modal.querySelector('#editBody').value.trim();if(!medicine||!body){alert('약 이름과 글 내용을 모두 입력해주세요.');return}try{const d=await api('/api/posts/'+x.id+'/',{method:'PUT',body:JSON.stringify({medicine,body,private:modal.querySelector('#editPrivate').checked})});const i=state.profile.posts.findIndex(p=>p.id===x.id);if(i>=0)state.profile.posts[i]=d.post;modal.remove();state.screen='ward';app()}catch(e){alert(e.message)}}}
async function loadTour(){try{const d=await api('/api/rooms/');const grid=document.getElementById('tourGrid');if(!grid)return;grid.innerHTML=d.rooms.length?d.rooms.map(q=>`<div class="room-card"><h3>${esc(q.code)}호실</h3><p>환자 ${esc(q.name)}</p><p>공개 처방 ${q.publicCount}개</p><button class="btn" style="font-size:19px;margin-top:10px" data-room="${q.id}">${q.isMe?'내 호실 보기':'들어가기'}</button></div>`).join(''):'<p style="font-size:23px">아직 다른 환자가 없습니다.</p>';grid.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>showRoom(Number(b.dataset.room)))}catch(e){document.getElementById('tourGrid').innerHTML=`<p class="error">${esc(e.message)}</p>`}}
async function showRoom(id){try{const d=await api('/api/rooms/'+id+'/');const q=d.room;const modal=document.createElement('div');modal.className='modal-bg';const visible=q.posts.map(x=>`<button class="btn" style="margin:8px;font-size:21px" data-i="${x.id}">💊 ${esc(x.medicine)}</button>`).join('');modal.innerHTML=`<div class="modal"><button class="back" id="close">✕</button><h2>🚪 ${esc(q.code)}호실</h2><div class="small">환자 ${esc(q.name)}</div><div style="margin:22px 0">${visible||'<p style="font-size:23px">공개된 처방이 없습니다.</p>'}</div><div class="center"><button class="btn" id="close2">나가기</button></div></div>`;document.body.appendChild(modal);modal.querySelector('#close').onclick=()=>modal.remove();modal.querySelector('#close2').onclick=()=>modal.remove();modal.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const x=q.posts.find(p=>p.id===Number(b.dataset.i));modal.remove();showPublicPost(x,q)})}catch(e){alert(e.message)}}
function showPublicPost(x,q){const modal=document.createElement('div');modal.className='modal-bg';modal.innerHTML=`<div class="modal"><button class="back" id="close">✕</button><h2>💊 ${esc(x.medicine)}</h2><div class="small">환자 ${esc(q.name)} · ${esc(q.code)}호실</div><div class="post-body">${esc(x.body)}</div><div class="center"><button class="btn" id="close2">닫기</button></div></div>`;document.body.appendChild(modal);modal.querySelector('#close').onclick=()=>modal.remove();modal.querySelector('#close2').onclick=()=>modal.remove()}

(async()=>{try{const d=await api('/api/me/');if(d.loggedIn){state.profile=d.profile;state.screen='ward'}}catch(e){}app()})();
</script>
</body>
</html>
